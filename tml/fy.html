<style>
:root {
  --panel-rgb: 42,50,58;
  --panel: rgba(var(--panel-rgb), .62);
  --panel-soft: rgba(var(--panel-rgb), .44);
  --panel-strong: rgba(var(--panel-rgb), .86);
  --line: rgba(255,255,255,.16);
  --text: #f7fbff;
  --muted: rgba(247,251,255,.68);
  --accent: #ff6b35;
  --accent2: #ffb86b;
  --bad: #ff5c7a;
  --ok: #68e39a;
  --radius: 18px;
  --shadow: 0 18px 50px rgba(0,0,0,.28);
  color-scheme: dark;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  max-width: 100%;
  min-width: 0;
  min-height: 100vh;
  background: transparent;
  color: var(--text);
  overflow-x: hidden;
}

html:not(.fm-native),
html:not(.fm-native) body {
  background: #222a32;
}

html.fm-native,
html.fm-native body {
  background: transparent;
}

body {
  overflow-x: hidden;
  letter-spacing: 0;
  position: relative;
  overscroll-behavior-x: none;
}

button, input, textarea, select {
  font: inherit;
  color: inherit;
}

button {
  border: 0;
  cursor: pointer;
  touch-action: manipulation;
  margin: 0;
  padding: 0;
  appearance: none;
  -webkit-appearance: none;
  background: transparent;
  text-align: inherit;
}

img {
  display: block;
  max-width: 100%;
  background: transparent;
}

.app {
  width: 100%;
  max-width: 100%;
  min-width: 0;
  min-height: 100vh;
  overflow-x: hidden;
  padding: 10px 10px 28px;
  background: transparent;
}

body.detail-active .app {
  visibility: hidden;
  pointer-events: none;
}

.top {
  position: relative;
  z-index: 1;
  background: rgba(var(--panel-rgb), 0.75);
  border-radius: 20px;
  padding: 24px 16px;
  margin: 10px auto 20px;
  max-width: 800px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  box-shadow: var(--shadow);
}

.bar {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  gap: 16px;
  width: 100%;
}

.brand {
  font-size: 28px;
  font-weight: 900;
  letter-spacing: 2px;
  text-shadow: 0 4px 14px rgba(0,0,0,.35);
  white-space: nowrap;
}

.brand b { color: var(--accent2); }

.search {
  flex: 1;
  width: 100%;
  max-width: 500px;
  display: flex;
  gap: 8px;
  align-items: center;
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 999px;
  padding: 6px 6px 6px 18px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.05);
}

.search input {
  flex: 1;
  min-width: 0;
  background: transparent;
  border: 0;
  outline: 0;
  color: var(--text);
  font-size: 15px;
}

.search input::placeholder { color: var(--muted); }

button, .btn {
  border: 1px solid var(--line);
  background: var(--panel-soft);
  color: var(--text);
  border-radius: 999px;
  padding: 8px 16px;
  font-size: 14px;
  cursor: pointer;
  white-space: nowrap;
}

.btn.primary, button.primary {
  border-color: rgba(255,107,53,.45);
  background: linear-gradient(135deg, rgba(255,107,53,.90), rgba(255,184,107,.72));
  color: #17110d;
  font-weight: 800;
  padding: 10px 20px;
}

.tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  width: 100%;
  padding: 0;
}

.tab {
  border-radius: 999px;
  padding: 8px 18px;
  font-size: 15px;
  background: rgba(255,255,255,.08);
  border: 2px solid transparent;
  color: var(--muted);
  transition: all 0.2s;
}

.tab.active {
  background: transparent;
  color: var(--text);
  border-color: rgba(255,184,107,0.8);
  font-weight: 800;
}

.hero {
  margin: 10px 0 16px;
  padding: 18px;
  border-radius: var(--radius);
  background: linear-gradient(135deg,rgba(255,107,53,.28),rgba(42,50,58,.54));
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
}

.hero h1 { margin: 0 0 8px; font-size: 24px; }
.hero p { margin: 0; color: var(--muted); line-height: 1.6; }

.status {
  margin: 10px 2px;
  color: var(--muted);
  font-size: 14px;
  text-align: center;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0,1fr));
  gap: 10px;
}

.card {
  position: relative;
  min-width: 0;
  border-radius: 15px;
  overflow: hidden;
  background: linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.045));
  border: 1px solid rgba(255,255,255,.12);
  box-shadow: 0 10px 28px rgba(0,0,0,.22);
  cursor: pointer;
  transition: transform 0.2s;
}

.poster {
  aspect-ratio: 3/4;
  background: rgba(255,255,255,.08);
  overflow: hidden;
  position: relative;
  padding-bottom: 133.33%;
}

.poster img {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
  filter: saturate(1.04) contrast(1.03);
}

.poster .noimg {
  position: absolute;
  top: 0; left: 0;
  height: 100%; width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  font-size: 28px;
}

.meta {
  padding: 8px 8px 10px;
  background: linear-gradient(180deg,rgba(18,24,30,.15),rgba(18,24,30,.44));
}

.name {
  font-weight: 800;
  font-size: 16px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.remark {
  margin-top: 4px;
  color: var(--muted);
  font-size: 14px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.section { margin: 16px 0; }

.section-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 0 2px 10px;
}

.section-title h2 {
  margin: 0;
  font-size: 17px;
  letter-spacing: .3px;
}

.rank { display: grid; gap: 8px; }

.rank-item {
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 11px 12px;
  border-radius: 14px;
  background: var(--panel-soft);
  border: 1px solid var(--line);
  cursor: pointer;
}

.rank-no {
  width: 32px; height: 32px;
  display: grid;
  place-items: center;
  border-radius: 10px;
  background: rgba(255,107,53,.22);
  font-weight: 900;
  color: var(--accent2);
}

.rank-title {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sheet {
  position: fixed;
  top: 0; right: 0; bottom: 0; left: 0;
  z-index: 40;
  display: none;
  background: transparent;
  overflow: hidden;
  width: 100%;
  height: 100%;
}

.sheet.active { display: block; }

.sheet-inner {
  height: 100vh;
  min-height: 100vh;
  padding: 12px;
  background: transparent;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  touch-action: pan-y;
}

.detail-panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 22px;
  box-shadow: var(--shadow);
  padding: 14px;
  margin-bottom: 42px;
  touch-action: pan-y;
}

.detail-head {
  display: grid;
  grid-template-columns: 118px 1fr;
  gap: 14px;
}

.detail-pic {
  width: 118px; height: 157px;
  border-radius: 14px;
  object-fit: cover;
  background: rgba(255,255,255,.08);
}

.detail-title {
  font-size: 22px;
  font-weight: 900;
  margin: 2px 0 8px;
}

.detail-info {
  color: var(--muted);
  line-height: 1.65;
  font-size: 14px;
  min-width: 0;
}

.desc {
  margin-top: 12px;
  color: rgba(255,255,255,.82);
  line-height: 1.72;
  max-height: 8.6em;
  overflow: auto;
}

.line-tabs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  margin: 12px 0 8px;
  padding-bottom: 2px;
}

.line-tab {
  border-radius: 999px;
  padding: 8px 12px;
  background: rgba(255,255,255,.08);
  border: 1px solid var(--line);
  white-space: nowrap;
}

.line-tab.active {
  background: rgba(255,107,53,.36);
  border-color: rgba(255,184,107,.55);
  font-weight: 800;
}

.episodes {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 12px;
  max-height: none;
  overflow: visible;
  touch-action: pan-y;
}

.ep {
  border-radius: 12px;
  padding: 9px 11px;
  background: rgba(255,255,255,.09);
  border: 1px solid var(--line);
  cursor: pointer;
  min-width: 68px;
}

.empty {
  padding: 30px 18px;
  text-align: center;
  color: var(--muted);
  background: var(--panel-soft);
  border: 1px dashed var(--line);
  border-radius: var(--radius);
}

.loading { opacity: .75; }

.focusable:focus,
.card:focus,
.rank-item:focus,
.ep:focus,
button:focus,
.tab:focus,
input:focus {
  outline: 2px solid rgba(255,184,107,.76);
  outline-offset: 2px;
  transform: translateY(-1px);
}

@media (min-width: 768px) and (orientation: landscape) {
  .app {
    padding: 18px 28px 44px;
    max-width: 1380px;
    margin: 0 auto;
  }
  .top {
    padding: 40px;
    margin: 30px auto;
    border-radius: 32px;
    gap: 24px;
    max-width: 900px;
  }
  .bar { flex-direction: row; gap: 24px; }
  .brand { font-size: 36px; }
  .search { padding: 8px 8px 8px 24px; max-width: 650px; }
  .search input { font-size: 18px; }
  .btn.primary, button.primary { padding: 12px 28px; font-size: 16px; }
  .tabs { gap: 14px; max-width: 700px; }
  .tab { padding: 10px 24px; font-size: 16px; }
  .grid { grid-template-columns: repeat(6, minmax(0,1fr)); gap: 16px; }
  .detail-head { grid-template-columns: 160px 1fr; }
  .detail-pic { width: 160px; height: 213px; }
  .focusable:focus, .card:focus, .ep:focus, button:focus, .tab:focus, input:focus {
    transform: scale(1.05);
    outline: 4px solid #ffb86b;
    outline-offset: 4px;
  }
}

@media (min-width: 1200px) and (orientation: landscape) {
  .grid { grid-template-columns: repeat(8, minmax(0,1fr)); }
}

@media (max-width: 480px), (orientation: portrait) {
  .app { padding: 8px 9px 24px; }
  .top { padding: 20px 12px; margin: 10px auto; border-radius: 20px; gap: 16px; }
  .bar { flex-direction: row; gap: 10px; }
  .brand { font-size: 22px; }
  .search { padding: 4px 4px 4px 14px; }
  .search input { font-size: 14px; }
  .btn.primary, button.primary { padding: 8px 16px; font-size: 14px; }
  .tabs { gap: 8px; }
  .tab { padding: 8px 14px; font-size: 14px; }
  .grid { grid-template-columns: repeat(3, minmax(0,1fr)); gap: 9px; }
  .meta { padding: 7px 7px 9px; }
  .name { font-size: 13px; }
  .remark { font-size: 11px; }
  .detail-head { grid-template-columns: 104px 1fr; gap: 12px; }
  .detail-pic { width: 104px; height: 138px; }
  .detail-title { font-size: 20px; }
  .sheet-inner { padding: 10px; }
  .detail-panel { border-radius: 20px; padding: 12px; }
  .ep { min-width: 64px; padding: 8px 9px; }
}
</style>
</head>

  function markNative() {
    if (window.fongmiBridge || window.fm || window.fongmi) {
      document.documentElement.classList.add("fm-native");
    }
  }

  function waitFm(ms) {
    if (ms == null) ms = 1600;
    markNative();
    if (window.fm) {
      fmReady = true;
      return Promise.resolve(window.fm);
    }
    return new Promise(function (r) {
      var done = false;
      var ok = function () {
        if (done) return;
        done = true;
        markNative();
        fmReady = !!window.fm;
        r(window.fm || null);
      };
      window.addEventListener("fmsdk", ok, { once: true });
      setTimeout(ok, ms);
    });
  }

  function sdk() {
    if (window.fm) {
      var pan = window.fm.pan || {};
      return Object.assign({}, window.fm, { pan: pan, check: pan.check || window.fm.check });
    }
    var check = function (items) {
      return { results: (items || []).map(function (item) {
        return { type: item.type, url: item.url, normalized_url: item.url, state: "idle", summary: "浏览器预览不检测", cache_hit: false, checked_at: Date.now(), expires_at: Date.now() + 300000 };
      })};
    };
    var play = function (payload) {
      var item = payload || {};
      var url = addPanPassword(String(item.url || ""), item.password || "", { diskType: item.type });
      if (url) window.open(url, "_blank", "noopener,noreferrer");
    };
    return {
      req: browserRequest,
      res: function (url) { return url; },
      play: function (url, title) { window.open(url, "_blank", "noopener,noreferrer"); },
      search: function (kw) { toast("原生搜索：" + kw); },
      openLive: function () { toast("请在 App 中打开直播"); },
      history: function () { return []; },
      vod: function (siteKey, vodId, title) { toast("原生播放：" + (title || vodId || siteKey || "")); },
      pan: { check: check, play: play },
      check: check,
      ui: { setToolbar: function () {} },
      cache: {
        get: function (key) { return localStorage.getItem("fm_" + key) || ""; },
        set: function (key, value) { localStorage.setItem("fm_" + key, value); },
        del: function (key) { localStorage.removeItem("fm_" + key); }
      },
      site: function () { return { key: "browser", name: "浏览器预览" }; },
      config: function () { return { id: "browser", url: location.href, driveCheck: false }; },
      device: function () { return { type: 1 } }
    };
  }

  function isTvMode() {
    return document.documentElement.classList.contains("tv-mode");
  }

  function isNativeMobileClient() {
    var client = window.fongmiClient || {};
    if (client.isMobile === true) return true;
    if (String(client.mode || "").toLowerCase() === "mobile") return true;
    return false;
  }

  function isNativeLeanbackClient() {
    var client = window.fongmiClient || {};
    if (client.isLeanback === true) return true;
    if (String(client.mode || "").toLowerCase() === "leanback") return true;
    return false;
  }

  function syncClientModeClasses() {
    document.documentElement.classList.toggle("native-mobile-app", isNativeMobileClient());
  }

  function setTvMode(tv) {
    document.documentElement.classList.toggle("tv-mode", !!tv);
    syncClientModeClasses();
  }

  function setNativeToolbarVisible(visible, force) {
    if (!force && !isTvMode() && !isNativeMobileClient()) return;
    try {
      var ui = sdk().ui || {};
      if (ui.setToolbar) ui.setToolbar(visible);
    } catch (e) {}
  }

  function syncNativeToolbarForRoute() {
    setNativeToolbarVisible(uiSnapshotRoute() === "home");
  }

  async function detectDeviceMode() {
    try {
      if (window.fongmiBridge && !window.fm) await waitFm(1500);
      var api = sdk();
      if (isNativeLeanbackClient()) {
        state.deviceMode = "leanback";
        setTvMode(true);
        return true;
      }
      if (isNativeMobileClient()) state.deviceMode = "mobile";
      if (!api.device) {
        setNativeToolbarVisible(true, true);
        document.documentElement.classList.remove("tv-mode");
        syncClientModeClasses();
        return false;
      }
      var device = await api.device();
      var mode = String(device && device.mode || "").toLowerCase();
      var tv = Number(device && device.type) === 0 || mode === "leanback";
      var nativeClient = !!(window.fm || window.fongmiBridge || window.fongmiClient);
      state.deviceMode = tv ? "leanback" : nativeClient && (Number(device && device.type) === 1 || mode === "mobile") ? "mobile" : "browser";
      setTvMode(tv);
      return tv;
    } catch (e) {
      setNativeToolbarVisible(true, true);
      document.documentElement.classList.remove("tv-mode");
      state.deviceMode = isNativeMobileClient() ? "mobile" : "browser";
      syncClientModeClasses();
      return false;
    }
  }

  function abs(u) {
    try { return new URL(u, BASE + '/').href; }
    catch (e) { return u || ''; }
  }

  function esc(s) {
    return String(s || '').replace(/[&<>'"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c];
    });
  }

  function escapeHtml(s) { return esc(s); }

  function escapeAttr(s) {
    return String(s || "").replace(/["\\\n\r]/g, "");
  }

  function clean(s) {
    return String(s || '').replace(/\s+/g, ' ').replace(/[]/g, '').trim();
  }

  function imgUrl(u) {
    u = abs(u || '');
    if (!u) return '';
    try { return window.fm && fm.res ? fm.res(u, { headers: { Referer: BASE + '/' } }) : u; }
    catch (e) { return u; }
  }

  async function reqText(url) {
    url = abs(url);
    status.textContent = '加载：' + url;
    try {
      if (window.fm && fm.req) {
        var r = await fm.req(url, { method: 'GET', headers: { 'User-Agent': UA, 'Referer': BASE + '/' }, responseType: 'text', timeout: 25, credentials: 'include' });
        if (!r.ok && r.status !== 200) throw new Error(r.error || ('HTTP ' + r.status));
        return r.body || r.content || r.data || r.text || '';
      }
      var response = await fetch(url, { headers: { 'Referer': BASE + '/' } });
      return await response.text();
    } catch (e) {
      status.textContent = '加载失败：' + e.message;
      throw e;
    }
  }

  function doc(html) { return new DOMParser().parseFromString(html, 'text/html'); }

  function cardFromA(a) {
    var href = abs(a.getAttribute('href') || '');
    var img = a.querySelector('img');
    var image = img ? (img.getAttribute('data-src') || img.getAttribute('data-original') || img.getAttribute('src') || '') : '';
    var title = a.getAttribute('title') || (img ? img.getAttribute('alt') : '') || '';
    var text = clean(a.textContent);
    if (!title) title = text.replace(/^(4K)?(今日更新)?(更新至|已完结|HD|全).*?/, '').slice(0, 24) || text;
    var remark = text.replace(title, '').slice(0, 40);
    return { title: clean(title), remark: clean(remark), href: href, image: abs(image) };
  }

  function unique(arr) {
    var m = new Map();
    arr.forEach(function (x) {
      if (x && x.href && x.title && !m.has(x.href)) m.set(x.href, x);
    });
    var res = [];
    m.forEach(function (v) { res.push(v); });
    return res;
  }

  function parseList(html, keyword) {
    if (keyword == null) keyword = '';
    var d = doc(html), sections = [];
    var badHost = function (el) {
      return !!el.closest('.pop-list-body,.search-hot,.history,.footer,.head-more,.slide-time,.banner,.swiper,.large-swiper,.popup');
    };
    var isGood = function (x) {
      return x && x.href && x.title && x.image && !/^点击观看$/.test(x.title);
    };

    var heads = [].slice.call(d.querySelectorAll('.title-a,.module-title,.title'))
      .map(function (h) { return { el: h, title: clean(h.textContent).replace('更多', '') }; })
      .filter(function (x) { return x.title && !/搜索|播放记录|搜索历史|热门搜索|更多/.test(x.title); });

    for (var h_i = 0; h_i < heads.length; h_i++) {
      var h = heads[h_i];
      var box = h.el.closest('.box-width,.module,.module-main,.layout-box,.box') || h.el.parentElement;
      var items = [];
      for (var i = 0; i < 4 && box; i++, box = box.parentElement) {
        items = unique([].slice.call(box.querySelectorAll('a[href*="/detail/"]'))
          .filter(function (a) { return !badHost(a); })
          .map(cardFromA))
          .filter(isGood)
          .slice(0, 24);
        if (items.length >= 3) break;
      }
      if (items.length) sections.push({ title: h.title, items: items });
    }

    if (!sections.length) {
      var items = unique([].slice.call(d.querySelectorAll('a[href*="/detail/"]'))
        .filter(function (a) { return !badHost(a); })
        .map(cardFromA))
        .filter(isGood);
      items = items.slice(0, 60);
      sections.push({ title: keyword ? ('搜索：' + keyword) : '影片列表', items: items });
    }
    return sections.filter(function (s) { return s.items.length; });
  }

  function parseDetail(html, url) {
    var d = doc(html);

    [].forEach.call(d.querySelectorAll('script, style'), function (el) {
      if (el.parentNode) el.parentNode.removeChild(el);
    });

    var h1 = d.querySelector('h1');
    var title = clean(h1 ? h1.textContent : d.title.replace(/《|》|免费观看.*$/g, ''));

    var pic = d.querySelector('.detail-pic img,.vod-pic img,.poster img,img[alt]');
    var image = pic ? (pic.getAttribute('data-src') || pic.getAttribute('src')) : '';

    var raw = (d.body ? (d.body.innerText || d.body.textContent || '') : '').replace(/\r/g, '');
    var lines = raw.split('\n').map(function (x) { return clean(x); }).filter(Boolean);

    function pickLine(label) {
      var re = new RegExp('^' + label + '\\s*[：:]?\\s*(.*)$');
      var line = lines.filter(function (x) { return re.test(x); })[0];
      if (!line) return '';
      var v = (line.match(re) || [])[1] || '';
      v = v.replace(/^(：|:)/, '').trim();
      return v.length > 120 ? v.slice(0, 120) + '…' : v;
    }

    var fields = [
      ['类型', pickLine('类型')],
      ['导演', pickLine('导演')],
      ['演员', pickLine('演员')],
      ['连载', pickLine('连载')],
      ['更新', pickLine('更新')]
    ].filter(function (x) { return x[1]; });

    var desc = '';
    var i = -1;
    for (var j = 0; j < lines.length; j++) {
      if (lines[j] === '简介' || lines[j].indexOf('简介') === 0) { i = j; break; }
    }

    if (i >= 0) {
      var arr = [];
      for (var k = i + 1; k < lines.length; k++) {
        if (/^(播放线路|资源列表|热播推荐|⚠️|重要提醒|排序|至臻|蓝光|自营)/.test(lines[k])) break;
        if (lines[k] && lines[k] !== '展开') arr.push(lines[k]);
      }
      desc = clean(arr.join(' '));
    }
    if (!desc) {
      var m = raw.match(/简介\s*([\s\S]*?)(?:播放线路|资源列表|热播推荐|⚠️)/);
      desc = m ? clean(m[1]) : '暂无简介';
    }
    if (desc.length > 360) desc = desc.slice(0, 360) + '…';

    var lineNames = [].slice.call(d.querySelectorAll('.anthology-tab a'))
      .map(function (a) { return clean(a.textContent).replace(/\(\d+\)$/, '').trim(); });
    var lists = [].slice.call(d.querySelectorAll('.anthology-list-box'));
    var linesGroup = [];

    if (lists.length > 0) {
      lists.forEach(function (list, index) {
        var name = lineNames[index] || ('线路' + (index + 1));
        var eps = [].slice.call(list.querySelectorAll('a[href*="/play/"]')).map(function (a) {
          return { title: clean(a.textContent) || '播放', href: abs(a.getAttribute('href')), remark: '', image: '' };
        });
        if (eps.length > 0) {
          linesGroup.push({ sid: String(index + 1), name: name, eps: eps });
        }
      });
    } else {
      var eps = unique([].slice.call(d.querySelectorAll('a[href*="/play/"]')).map(function (a) {
        return { title: clean(a.textContent) || '播放', href: abs(a.getAttribute('href')), remark: '', image: '' };
      }));

      var groups = {};
      function epNo(ep) {
        var m = (ep.href || '').match(/\/play\/\d+-\d+-(\d+)\.html/);
        if (m) return parseInt(m[1], 10) || 0;
        var t = (ep.title || '').match(/(\d+)/);
        return t ? parseInt(t[1], 10) : 0;
      }
      eps.forEach(function (ep) {
        var m = ep.href.match(/\/play\/\d+-(\d+)-\d+\.html/);
        var sid = m ? m[1] : '1';
        (groups[sid] || (groups[sid] = [])).push(ep);
      });
      Object.keys(groups).forEach(function (sid) { groups[sid].sort(function (a, b) { return epNo(a) - epNo(b); }); });

      var autoLineNames = [];
      var re = /([^\s\n()]{2,12})\((\d+)\)/g;
      var match;
      while ((match = re.exec(raw)) !== null) {
        var name = clean(match[1]);
        if (!/提醒|搜索|播放|记录/.test(name) && autoLineNames.indexOf(name) === -1) {
          autoLineNames.push(name);
        }
      }

      linesGroup = Object.keys(groups).map(function (sid, i) {
        return { sid: sid, name: autoLineNames[i] || ('线路' + sid), eps: groups[sid] };
      });
    }

    return { title: title, image: abs(image), fields: fields, desc: desc, eps: linesGroup.length > 0 ? linesGroup[0].eps : [], lines: linesGroup, url: url };
  }

  function parsePlay(html, playPage) {
    var p = null;
    var m = html.match(/var\s+player_aaaa\s*=\s*(\{[\s\S]*?\})\s*<\/script>/);
    if (m) {
      try { p = JSON.parse(m[1].replace(/\\\//g, '/')); } catch (e) {}
    }
    var d = doc(html);
    var iframe = d.querySelector('iframe[src*="url="]');
    var src = iframe ? abs(iframe.getAttribute('src')) : '';
    if (!src && p && p.url) src = 'https://fgsrg.hzqingshan.com/player/?url=' + encodeURIComponent(p.url);

    var title = document.title || '枫叶播放';
    if (p && p.vod_data && p.vod_data.vod_name) {
      title = p.vod_data.vod_name;
    }
    return { src: src, token: (p && p.url) || '', title: title, from: (p && p.from) || '', page: playPage };
  }

  function setStatus(t) {
    status.textContent = t || '';
  }

  function renderTabs(active) {
    tabs.innerHTML = CATS.map(function (c) {
      return '<button class="tab focusable ' + (abs(c[1]) === abs(active) ? 'active' : '') + '" data-url="' + esc(abs(c[1])) + '">' + esc(c[0]) + '</button>';
    }).join('');
    [].forEach.call(tabs.querySelectorAll('.tab'), function (b) {
      b.onclick = function () { loadPage(b.dataset.url); };
    });
  }

  function renderSections(sections) {
    content.innerHTML = sections.map(function (sec) {
      return '<section class="section"><div class="section-title"><h2>' + esc(sec.title) + '</h2></div><div class="grid">' +
        sec.items.map(function (it) {
          return '<article class="card focusable" tabindex="0" data-href="' + esc(it.href) + '">' +
            '<div class="poster">' + (it.image ?
              '<img loading="lazy" referrerpolicy="no-referrer" src="' + esc(imgUrl(it.image)) + '" alt="' + esc(it.title) + '">' :
              '<div class="noimg">枫</div>') +
            '</div><div class="meta"><div class="name">' + esc(it.title) + '</div><div class="remark">' + esc(it.remark || '点击查看详情') + '</div></div></article>';
        }).join('') +
        '</div></section>';
    }).join('');

    [].forEach.call(content.querySelectorAll('.card'), function (c) {
      c.onclick = function () { openDetail(c.dataset.href); };
    });
  }

  async function loadPage(url) {
    currentUrl = abs(url);
    renderTabs(currentUrl);
    content.innerHTML = '<div class="empty loading">正在加载内容…</div>';
    try {
      var html = await reqText(currentUrl);
      var sections = parseList(html);
      renderSections(sections);
      setStatus('已加载 ' + sections.reduce(function (n, s) { return n + s.items.length; }, 0) + ' 条内容');
      restoreFocus();
    } catch (e) {
      content.innerHTML = '<div class="empty">加载失败：' + esc(e.message) + '</div>';
    }
  }

  async function search(q) {
    q = clean(q);
    if (!q) return;
    history.pushState({ route: 'search', q: q }, '', '#search=' + encodeURIComponent(q));
    renderTabs('');
    content.innerHTML = '<div class="empty loading">搜索中…</div>';
    try {
      var url = BASE + '/cupfox-search/-------------.html?wd=' + encodeURIComponent(q);
      var html = await reqText(url);
      var sections = parseList(html, q);
      if (!sections.length || !sections[0].items.length) {
        content.innerHTML = '<div class="empty">没有找到相关结果</div>';
        setStatus('无搜索结果：' + q);
        return;
      }
      sections[0].title = '搜索：' + q;
      renderSections(sections);
      setStatus('搜索完成：' + q);
    } catch (e) {
      content.innerHTML = '<div class="empty">搜索失败，请换个关键词重试。</div>';
    }
  }

  async function openDetail(url) {
    lastFocus = document.activeElement;
    document.body.classList.add('detail-active');
    var sheet = $('detailSheet');
    sheet.classList.add('active');
    sheet.setAttribute('aria-hidden', 'false');
    var panel = $('detailPanel');
    panel.innerHTML = '<div class="empty loading">正在读取详情…</div>';
    history.pushState({ route: 'detail', url: url }, '', '#detail=' + encodeURIComponent(url));
    try {
      var html = await reqText(url);
      var d = parseDetail(html, url);
      var firstLine = d.lines[0] || { sid: '1', name: '默认线路', eps: d.eps };

      panel.innerHTML =
        '<button class="focusable" id="closeDetail">返回</button>' +
        '<div class="detail-head">' +
          '<img class="detail-pic" referrerpolicy="no-referrer" src="' + esc(imgUrl(d.image)) + '" onerror="this.style.display=\'none\'">' +
          '<div>' +
            '<div class="detail-title">' + esc(d.title) + '</div>' +
            '<div class="detail-info">' + d.fields.map(function (x) {
              return '<div><b>' + esc(x[0]) + '</b>：' + esc(x[1]) + '</div>';
            }).join('') || '枫叶影院资源' +
            '</div>' +
            '<p class="desc">' + esc(d.desc || '暂无简介') + '</p>' +
          '</div>' +
        '</div>' +
        '<h3>播放线路</h3>' +
        '<div class="line-tabs">' + (d.lines.length ? d.lines : [firstLine]).map(function (ln, i) {
          return '<button class="line-tab focusable ' + (i === 0 ? 'active' : '') + '" data-sid="' + esc(ln.sid) + '">' + esc(ln.name) + '(' + ln.eps.length + ')</button>';
        }).join('') + '</div>' +
        '<div class="episodes" id="episodeBox"></div>';

      function renderLine(sid) {
        var ln = d.lines.filter(function (x) { return x.sid == sid; })[0] || firstLine;
        var box = $('episodeBox');
        box.innerHTML = ln.eps.map(function (ep) {
          return '<button class="ep focusable" data-href="' + esc(ep.href) + '">' + esc(ep.title) + '</button>';
        }).join('') || '<div class="empty">暂无分集</div>';

        [].forEach.call(box.querySelectorAll('.ep'), function (b) {
          b.onclick = function () { playEpisode(b.dataset.href, d.title + ' ' + b.textContent); };
        });
      }

      $('closeDetail').onclick = closeDetail;
      var ltabs = panel.querySelectorAll('.line-tab');
      [].forEach.call(ltabs, function (b) {
        b.onclick = function () {
          [].forEach.call(ltabs, function (x) { x.classList.remove('active'); });
          b.classList.add('active');
          renderLine(b.dataset.sid);
        };
      });

      renderLine(firstLine.sid);
      setTimeout(function () {
        var firstEp = $('episodeBox').querySelector('.ep');
        if (firstEp) { firstEp.focus({ preventScroll: true }); }
        else { $('closeDetail').focus({ preventScroll: true }); }
      }, 50);
    } catch (e) {
      panel.innerHTML = '<button class="focusable" onclick="window.__fyClose()">返回</button><div class="empty">详情加载失败：' + esc(e.message) + '</div>';
    }
  }

  async function playEpisode(url, title) {
    setStatus('正在发送嗅探播放…');
    try {
      if (window.fm && fm.play) {
        await fm.play('push://' + url, title);
        setStatus('已发送嗅探播放：' + title);
        return;
      }
    } catch (e) {}
    try {
      if (window.fm && fm.pan && fm.pan.play) {
        await fm.pan.play({ type: 'http', url: url, title: title });
        setStatus('已发送推送播放：' + title);
        return;
      }
    } catch (e) {}
    setStatus('打开原站播放页嗅探…');
    location.href = url;
  }

  function closeDetail() {
    document.body.classList.remove('detail-active');
    var sheet = $('detailSheet');
    sheet.classList.remove('active');
    sheet.setAttribute('aria-hidden', 'true');
    if (location.hash.indexOf('#detail=') === 0) history.back();
    if (lastFocus && lastFocus.focus) setTimeout(function () { lastFocus.focus({ preventScroll: true }); }, 50);
  }
  window.__fyClose = closeDetail;

  async function nativeSearch(q) {
    q = q || clean($('kw').value);
    if (!q) return;
    if (window.fm && fm.search) {
      try { await fm.search(q, { direct: true }); return; } catch (e) {}
    }
    search(q);
  }

  function restoreFocus() {
    setTimeout(function () {
      var el = document.querySelector('.tab.active') || document.querySelector('.card');
      if (el) el.focus({ preventScroll: true });
    }, 30);
  }

  function handleKeys(e) {
    if (e.key === 'Escape' || e.key === 'Backspace') {
      var sheet = $('detailSheet');
      if (sheet && sheet.classList.contains('active')) {
        e.preventDefault();
        closeDetail();
        return;
      }
    }
    if (e.key === 'Enter' && document.activeElement &&
        document.activeElement.classList.contains('focusable') &&
        document.activeElement.tagName !== 'INPUT') {
      document.activeElement.click();
    }
  }

  function boot() {
    setStatus('正在初始化…');
    renderTabs(BASE + '/');
    $('searchForm').onsubmit = function (e) {
      e.preventDefault();
      search($('kw').value);
    };
    document.addEventListener('keydown', handleKeys, true);
    window.addEventListener('popstate', function () {
      var sheet = $('detailSheet');
      if (sheet && sheet.classList.contains('active')) {
        document.body.classList.remove('detail-active');
        sheet.classList.remove('active');
        sheet.setAttribute('aria-hidden', 'true');
      } else {
        loadPage(currentUrl);
      }
    });
    loadPage(BASE + '/');
  }

  setTimeout(function () {
    try { if (status && status.textContent === '准备加载…') status.textContent = '正在初始化 WebHome…'; } catch (e) {}
  }, 800);

  waitFm().then(function () {
    try { boot(); } catch (e) { status.textContent = '启动失败：' + e.message; }
  });

  async function browserRequest(url, options) {
    var init = options || {};
    try {
      var response = await fetch(url, {
        method: init.method || 'GET',
        headers: init.headers || {},
        body: (init.method && init.method !== 'GET' && init.method !== 'HEAD') ? (init.body || '') : undefined,
        credentials: init.credentials === 'include' ? 'include' : 'same-origin'
      });
      var headers = {};
      response.headers.forEach(function (value, key) { headers[key] = value; });
      var body = init.responseType === 'json' ? await response.json() : await response.text();
      return { ok: response.ok, status: response.status, url: response.url, headers: headers, body: body };
    } catch (e) {
      throw e;
    }
  }

  function uiSnapshotRoute() {
    var sheet = $('detailSheet');
    return (sheet && sheet.classList.contains('active')) ? 'detail' : 'home';
  }

  function focusRemoteTarget(target) {
    if (!target) return;
    try {
      target.focus({ preventScroll: true });
    } catch (e) {
      target.focus();
    }
  }

  function isVisibleFocusable(el) {
    if (!el || !el.isConnected) return false;
    var style = getComputedStyle(el);
    if (style.display === 'none' || style.visibility === 'hidden' || style.opacity === '0') return false;
    var rect = el.getBoundingClientRect();
    return rect.width > 0 && rect.height > 0;
  }

  function toast(text) {
    var el = document.createElement('div');
    el.style.cssText = 'position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));z-index:90;transform:translateX(-50%);max-width:calc(100vw - 28px);padding:10px 12px;border-radius:8px;background:rgba(6,8,10,.86);border:1px solid rgba(255,255,255,.16);color:#f7fbff;box-shadow:0 18px 50px rgba(0,0,0,.28);font-size:13px;pointer-events:none;transition:.18s ease;';
    el.textContent = text;
    document.body.appendChild(el);
    setTimeout(function () {
      el.style.opacity = '0';
      setTimeout(function () { el.remove(); }, 200);
    }, 2000);
  }

})();
</script>
</body>
